name: Build APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Download ZIP
        run: |
          wget "https://github.com/far1992ed/ch/releases/download/v1.0/libstockfish.so.zip" -O game.zip
          
      - name: Setup Project
        run: |
          mkdir -p app/src/main/java/com/game/app app/src/main/assets
          unzip -o game.zip -d app/src/main/assets/
          
          echo 'include ":app"' > settings.gradle
          echo 'buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.1.4" } } allprojects { repositories { google(); mavenCentral() } }' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          
          echo 'apply plugin: "com.android.application"
          android { namespace "com.game.app"; compileSdk 34; defaultConfig { applicationId "com.game.app"; minSdk 21; targetSdk 34 } }' > app/build.gradle
          
          echo 'package com.game.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              protected void onCreate(Bundle b) { super.onCreate(b);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.loadUrl("file:///android_asset/index.html");
                  setContentView(w);
              }
          }' > app/src/main/java/com/game/app/MainActivity.java
          
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Game" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>' > app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          ./gradle-8.0/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-APK
          path: app/build/outputs/apk/debug/app-debug.apk
